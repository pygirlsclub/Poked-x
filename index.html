<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Faz o site se ajustar à largura do celular. Sem essa linha, o celular mostra a versão "de computador" bem pequenininha. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poked-x</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- TELA 1: apresentação -->
  <section id="tela-apresentacao" class="tela tela-ativa">
    <h1>Olá, treinadora!</h1>
    <img id="imagem-pokemon-apresentacao" class="animacao-flutuar" alt="Pokémon de boas-vindas" src="">
    <button id="botao-comecar" type="button">COMEÇAR</button>
  </section>

  <!-- TELA 2: lista de pokémons -->
  <section id="tela-lista" class="tela">
    <header class="topo">
      <h2>Pokémons</h2>
      <button id="botao-ir-pastas" type="button">Minhas pastas</button>
    </header>

    <div class="barra-pesquisa">
      <input id="pesquisa-lista" type="search" placeholder="Buscar pelo nome" aria-label="Buscar pokémon pelo nome">
      <select id="filtro-tipo-lista" aria-label="Filtrar por tipo">
        <option value="">Todos os tipos</option>
      </select>
      <button id="limpar-filtros-lista" type="button" class="botao-secundario">Limpar filtros</button>
    </div>

    <p id="mensagem-lista" class="mensagem" role="status"></p>
    <ul id="lista-pokemons" class="grade-cards"></ul>
  </section>

  <!-- TELA 3: pastas -->
  <section id="tela-pastas" class="tela">
    <header class="topo">
      <button id="botao-voltar-lista" type="button" class="botao-secundario">Voltar</button>
      <h2>Minhas pastas</h2>
    </header>

    <div class="barra-pesquisa">
      <input id="nome-nova-pasta" type="text" placeholder="Nome da nova pasta" aria-label="Nome da nova pasta">
      <button id="botao-criar-pasta" type="button">Criar pasta</button>
    </div>

    <div class="barra-pesquisa">
      <input id="pesquisa-pastas" type="search" placeholder="Buscar nas pastas" aria-label="Buscar nas pastas">
      <select id="filtro-pasta" aria-label="Filtrar por pasta">
        <option value="">Todas as pastas</option>
      </select>
      <button id="limpar-filtros-pastas" type="button" class="botao-secundario">Limpar filtros</button>
    </div>

    <p id="mensagem-pastas" class="mensagem" role="status"></p>
    <div id="area-pastas"></div>

    <!-- Descrição detalhada do pokémon escolhido -->
    <aside id="detalhes-pokemon" class="detalhes" hidden></aside>
  </section>

  <script src="js/favoritos.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
